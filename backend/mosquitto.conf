# Mosquitto MQTT Broker Configuration (Aligned with Week 6 & 7 TLS Security Upgrade)

# 1. Standard MQTT listener
listener 1883
protocol mqtt

# 2. MQTT over TLS listener (Port 8883)
listener 8883
protocol mqtt
cafile /etc/mosquitto/certs/ca.crt
certfile /etc/mosquitto/certs/server.crt
keyfile /etc/mosquitto/certs/server.key
tls_version tlsv1.2

# 3. Connection & Access Control
allow_anonymous true
persistence true
persistence_location /mosquitto/data/

# 4. Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

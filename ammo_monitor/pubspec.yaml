name: ammo_monitor
description: "Hệ thống giám sát và điều phối vận chuyển đạn dược – DATN 253"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.6.0
  firebase_auth: ^6.3.0
  cloud_firestore: ^6.2.0
  firebase_storage: ^13.2.0

  # Map
  flutter_map: ^8.2.2
  latlong2: ^0.9.0

  # State Management
  provider: ^6.1.2

  # UI & Styling
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

  # Network
  http: ^1.6.0
  mqtt_client: ^10.11.1
  web_socket_channel: ^3.0.3

  # Utils
  intl: ^0.20.2
  audioplayers: ^6.6.0
  image_picker: ^1.0.7
  permission_handler: ^11.0.0
  wifi_iot: ^0.3.18
  connectivity_plus: ^5.0.2
  rxdart: ^0.28.0
  url_launcher: ^6.3.0
  universal_html: ^2.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/images/
